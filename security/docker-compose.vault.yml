services:
  vault:
    image: hashicorp/vault:1.17
    container_name: medical-chatbot-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token-medical-chatbot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    command: server -dev
