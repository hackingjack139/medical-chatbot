services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: medical-chatbot-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  logstash:
    build:
      context: ./logstash
    container_name: medical-chatbot-logstash
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "12201:12201/udp"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: medical-chatbot-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
