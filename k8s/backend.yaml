apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medical-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hackingjack139/medical-chatbot-backend:latest
          imagePullPolicy: Always
          env:
            - name: ML_SERVICE_URL
              value: http://ml-model:8000/predict
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /api/symptoms
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/symptoms
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medical-chatbot
spec:
  selector:
    app: backend
  ports:
    - port: 8081
      targetPort: 8081

