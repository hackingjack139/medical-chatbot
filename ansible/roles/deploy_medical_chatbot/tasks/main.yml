---
- name: Read Vault token from environment
  ansible.builtin.set_fact:
    vault_token: "{{ lookup('ansible.builtin.env', vault_token_env_var) }}"

- name: Read Vault address from environment
  ansible.builtin.set_fact:
    vault_addr_resolved: "{{ lookup('ansible.builtin.env', vault_addr_env_var) | default(vault_addr_default, true) }}"

- name: Read Vault dev root token from environment
  ansible.builtin.set_fact:
    vault_dev_root_token: "{{ lookup('ansible.builtin.env', vault_dev_root_token_env_var) | default(vault_token, true) }}"

- name: Ensure Vault token is provided
  ansible.builtin.assert:
    that:
      - vault_token is defined
      - vault_token | length > 0
    fail_msg: "Vault token is required. Export VAULT_TOKEN (and optionally VAULT_DEV_ROOT_TOKEN_ID) before running the deployment."

- name: Ensure deployment directory exists
  ansible.builtin.file:
    path: "{{ deploy_root }}"
    state: directory
    mode: "0755"

- name: Ensure security directory exists
  ansible.builtin.file:
    path: "{{ deploy_root }}/security"
    state: directory
    mode: "0755"

- name: Copy Vault compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../security/docker-compose.vault.yml"
    dest: "{{ deploy_root }}/security/{{ security_compose_file_name }}"
    mode: "0644"

- name: Start Vault
  ansible.builtin.command:
    cmd: docker compose -p {{ security_project_name }} -f {{ security_compose_file_name }} up -d
    chdir: "{{ deploy_root }}/security"
  environment:
    VAULT_DEV_ROOT_TOKEN_ID: "{{ vault_dev_root_token }}"
  register: vault_up
  changed_when: vault_up.rc == 0

- name: Wait for Vault API
  ansible.builtin.uri:
    url: "{{ vault_addr_resolved }}/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473, 501]
  register: vault_health
  until: vault_health.status in [200, 429, 472, 473]
  retries: 20
  delay: 2

- name: Read deployment secrets from Vault
  ansible.builtin.uri:
    url: "{{ vault_addr_resolved }}/v1/{{ vault_secret_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
    status_code: 200
  register: vault_secret_response

- name: Ensure required deployment secrets exist in Vault
  ansible.builtin.assert:
    that:
      - vault_secret_response.json.data.data.ml_service_url is defined
      - vault_secret_response.json.data.data.ml_service_url | length > 0
      - vault_secret_response.json.data.data.backend_shared_secret is defined
      - vault_secret_response.json.data.data.backend_shared_secret | length > 0
    fail_msg: "Required secrets are missing in Vault at {{ vault_secret_path }}. Populate ml_service_url and backend_shared_secret before deploying."

- name: Copy deployment compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.deploy.yml"
    dest: "{{ deploy_root }}/{{ compose_file_name }}"
    mode: "0644"

- name: Preserve previous deployment environment file if present
  ansible.builtin.copy:
    src: "{{ deploy_root }}/.env"
    dest: "{{ deploy_root }}/.env.previous"
    remote_src: true
    mode: "0600"
  failed_when: false

- name: Render deployment environment file from Vault secrets
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ deploy_root }}/.env"
    mode: "0600"

- name: Ensure observability directories exist
  ansible.builtin.file:
    path: "{{ deploy_root }}/observability/logstash/pipeline"
    state: directory
    mode: "0755"

- name: Copy ELK compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../observability/docker-compose.elk.yml"
    dest: "{{ deploy_root }}/observability/{{ observability_compose_file_name }}"
    mode: "0644"

- name: Copy Logstash Dockerfile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../observability/logstash/Dockerfile"
    dest: "{{ deploy_root }}/observability/logstash/Dockerfile"
    mode: "0644"

- name: Copy Logstash pipeline config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../observability/logstash/pipeline/logstash.conf"
    dest: "{{ deploy_root }}/observability/logstash/pipeline/logstash.conf"
    mode: "0644"

- name: Start ELK observability stack
  ansible.builtin.command:
    cmd: docker compose -p {{ observability_project_name }} -f {{ observability_compose_file_name }} up -d
    chdir: "{{ deploy_root }}/observability"
  register: observability_up
  changed_when: observability_up.rc == 0

- name: Remove old standalone app containers if present
  ansible.builtin.command:
    cmd: docker rm -f medical-chatbot-frontend medical-chatbot-backend medical-chatbot-ml
  register: remove_containers
  failed_when: false
  changed_when: remove_containers.rc == 0

- name: Pull latest deployment images
  ansible.builtin.command:
    cmd: docker compose -p {{ compose_project_name }} -f {{ compose_file_name }} pull
    chdir: "{{ deploy_root }}"
  register: compose_pull
  changed_when: "'Pulled' in compose_pull.stdout or 'Downloaded' in compose_pull.stdout or compose_pull.rc == 0"

- name: Start deployment stack
  ansible.builtin.command:
    cmd: docker compose -p {{ compose_project_name }} -f {{ compose_file_name }} up -d --remove-orphans
    chdir: "{{ deploy_root }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Recreated' in compose_up.stdout or 'Running' in compose_up.stdout or compose_up.rc == 0"
