services:
  ml-model:
    image: hackingjack139/medical-chatbot-ml:${APP_IMAGE_TAG:-latest}
    container_name: medical-chatbot-ml
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        tag: medical-chatbot-ml
    ports:
      - "8000:8000"

  backend:
    image: hackingjack139/medical-chatbot-backend:${APP_IMAGE_TAG:-latest}
    container_name: medical-chatbot-backend
    restart: unless-stopped
    depends_on:
      - ml-model
    env_file:
      - .env
    environment:
      ML_SERVICE_URL: ${ML_SERVICE_URL}
      BACKEND_SHARED_SECRET: ${BACKEND_SHARED_SECRET}
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        tag: medical-chatbot-backend
    ports:
      - "8081:8081"

  frontend:
    image: hackingjack139/medical-chatbot-frontend:${APP_IMAGE_TAG:-latest}
    container_name: medical-chatbot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        tag: medical-chatbot-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
